name: Banc de test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Vérifier syntaxe, scénarios et régressions
        run: npm test

      - name: Construire et valider l'artefact de production
        run: npm run test:production

      - name: Vérifier que le build ne modifie pas les sources
        run: git diff --exit-code
