name: Banc de test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Vérifier syntaxe, versions, scénarios et régressions
        run: npm test
