name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Tester l'application
        run: npm test

      - name: Construire la distribution de production
        run: npm run build

      - name: Vérifier que le build ne modifie pas les sources
        run: git diff --exit-code

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
