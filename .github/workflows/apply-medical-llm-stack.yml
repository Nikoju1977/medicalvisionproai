name: Apply medical LLM stack

on:
  push:
    branches:
      - feat/medical-agent-llm-stack
    paths:
      - tools/inject_medical_llm_stack.py
      - tools/inject_medical_evidence.py
      - tools/inject_multiagent_review.py
      - tools/build_vercel.py
      - .github/workflows/apply-medical-llm-stack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/medical-agent-llm-stack
          fetch-depth: 0
      - name: Inject medical model routing
        run: python3 tools/inject_medical_llm_stack.py
      - name: Inject recent medical evidence
        run: python3 tools/inject_medical_evidence.py
      - name: Inject independent review and critic agents
        run: python3 tools/inject_multiagent_review.py
      - name: Validate generated integration
        run: |
          grep -q "MEDICAL_LLM_STACK_V3" index.html
          grep -q "MEDICAL_EVIDENCE_RAG_V1" index.html
          grep -q "MEDICAL_MULTIAGENT_REVIEW_V1" index.html
          grep -q "medicalModelFor(expertKey, 'vision')" index.html
          grep -q "medicalModelFor('consensus', 'consensus')" index.html
          grep -q "const secondModel = medicalIndependentModelFor" index.html
          grep -q "medicalCriticForLectures(enriched, tri)" index.html
          grep -q "CRITIQUE CONTRADICTOIRE" index.html
          grep -q "modeles_agents" index.html
          grep -q "preuves_recentes" index.html
          grep -q "audit_multiagent" index.html
          grep -q "APP_VERSION = 'v16.4.0'" index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', s)
          Path('/tmp/medvision-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/medvision-inline.js
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: generate medical multi-agent review stack"
          git push origin feat/medical-agent-llm-stack
