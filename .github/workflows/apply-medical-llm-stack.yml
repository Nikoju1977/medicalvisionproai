name: Apply medical LLM stack

on:
  push:
    branches:
      - feat/medical-agent-llm-stack
    paths:
      - tools/inject_medical_llm_stack.py
      - tools/inject_medical_evidence.py
      - tools/inject_multiagent_review.py
      - tools/inject_quantitative_pass.py
      - tools/inject_dicom_calibration.py
      - tools/validate_medical_stack.py
      - tools/evaluate_medical_benchmark.py
      - tools/build_vercel.py
      - .github/workflows/apply-medical-llm-stack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/medical-agent-llm-stack
          fetch-depth: 0

      - name: Inject medical model routing
        run: python3 tools/inject_medical_llm_stack.py

      - name: Inject recent medical evidence
        run: python3 tools/inject_medical_evidence.py

      - name: Inject independent review and critic agents
        run: python3 tools/inject_multiagent_review.py

      - name: Inject quantitative post-detection pass
        run: python3 tools/inject_quantitative_pass.py

      - name: Inject DICOM calibration
        run: python3 tools/inject_dicom_calibration.py

      - name: Validate generated medical stack
        run: python3 tools/validate_medical_stack.py index.html

      - name: Benchmark evaluator smoke test
        run: |
          cat > /tmp/benchmark.jsonl <<'EOF'
          {"case_id":"T1","specialty":"pulmo","target":"pneumothorax","y_true":1,"score_a":0.9,"score_b":0.8,"critic_score":0.9}
          {"case_id":"T2","specialty":"pulmo","target":"pneumothorax","y_true":0,"score_a":0.1,"score_b":0.2,"critic_score":0.1}
          EOF
          python3 tools/evaluate_medical_benchmark.py /tmp/benchmark.jsonl --out /tmp/benchmark-report.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/benchmark-report.json'))
          assert d['overall']['reader_a']['tp'] == 1
          assert d['overall']['reader_a']['tn'] == 1
          assert d['overall']['reader_agreement']['raw_agreement'] == 1
          print('Benchmark evaluator smoke test OK')
          PY

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: generate medical multi-agent DICOM calibrated stack"
          git push origin feat/medical-agent-llm-stack
