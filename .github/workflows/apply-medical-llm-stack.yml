name: Apply medical LLM stack

on:
  push:
    branches:
      - feat/medical-agent-llm-stack
    paths:
      - tools/inject_medical_llm_stack.py
      - .github/workflows/apply-medical-llm-stack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/medical-agent-llm-stack
          fetch-depth: 0
      - name: Inject medical model routing
        run: python3 tools/inject_medical_llm_stack.py
      - name: Sanity checks
        run: |
          grep -q "MEDICAL_LLM_STACK_V1" index.html
          grep -q "medicalModelFor(expertKey, 'vision')" index.html
          grep -q "google/medgemma-27b-text-it" index.html
          grep -q "APP_VERSION = 'v16.3.0'" index.html
          node --check <(python3 - <<'PY'
          import re
          s=open('index.html', encoding='utf-8').read()
          blocks=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', s)
          print('\n'.join(blocks))
          PY
          ) || true
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: route medical agents through specialized MedGemma stack"
          git push origin feat/medical-agent-llm-stack
